<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Biodata Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background-color: rgb(245, 189, 222);
            max-width: 450px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }



        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Student Biodata Form</h2>

        <form id="biodataForm">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" required>

            <label for="matric">Matriculation Number:</label>
            <input type="text" id="matric" required>

            <label for="age">Age:</label>
            <input type="number" id="age" min="1" max="100" required>

            <label for="gender">Gender:</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="email">Email Address:</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone"
                   pattern="[0-9]{11}"
                   title="Enter an 11-digit phone number"
                   required>

            <label for="department">Department:</label>
            <input type="text" id="department" required>

            <button type="submit">Submit Biodata</button>

            <p id="message"></p>

        </form>
    </div>

    <script>
        const form = document.getElementById("biodataForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const fullname =
                document.getElementById("fullname").value.trim();

            const age =
                Number(document.getElementById("age").value);

            if (fullname.length < 3) {
                message.textContent =
                    "Please enter your full name correctly.";
                message.style.color = "red";
                return;
            }

            if (age < 1 || age > 100) {
                message.textContent =
                    "Please enter a valid age.";
                message.style.color = "red";
                return;
            }

            message.textContent =
                "Biodata submitted successfully!";
            message.style.color = "green";

            form.reset();
        });
    </script>

</body>
</html>
