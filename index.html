<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Bio-Data Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>Student Bio-Data Registration</h2>
      <p>Please fill in your correct personal and academic details below.</p>
    </header>

    <form id="bioDataForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required />
        <small class="error-msg" id="nameError"></small>
      </div>

      <!-- Matric / Student ID -->
      <div class="form-group">
        <label for="matricNo">Matric / Student ID <span class="required">*</span></label>
        <input type="text" id="matricNo" name="matricNo" placeholder="e.g. VUG/SEN/22/0001" required />
        <small class="error-msg" id="matricError"></small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="e.g. student@veritas.edu.ng" required />
        <small class="error-msg" id="emailError"></small>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 08012345678" required />
        <small class="error-msg" id="phoneError"></small>
      </div>

      <!-- Row with Gender and Date of Birth -->
      <div class="form-row">
        <div class="form-group half">
          <label for="gender">Gender <span class="required">*</span></label>
          <select id="gender" name="gender" required>
            <option value=""> Select Gender </option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <small class="error-msg" id="genderError"></small>
        </div>

        <div class="form-group half">
          <label for="dob">Date of Birth <span class="required">*</span></label>
          <input type="date" id="dob" name="dob" required />
          <small class="error-msg" id="dobError"></small>
        </div>
      </div>

      <!-- Row with Department and Level -->
      <div class="form-row">
        <div class="form-group half">
          <label for="department">Department <span class="required">*</span></label>
          <select id="department" name="department" required>
            <option value=""> Select Department </option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="Information Technology">Information Technology</option>
          </select>
          <small class="error-msg" id="deptError"></small>
        </div>

        <div class="form-group half">
          <label for="level">Level <span class="required">*</span></label>
          <select id="level" name="level" required>
            <option value=""> Select Level </option>
            <option value="100">100 Level</option>
            <option value="200">200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
          </select>
          <small class="error-msg" id="levelError"></small>
        </div>
      </div>

      <!-- State of Origin -->
      <div class="form-group">
        <label for="state">State of Origin</label>
        <input type="text" id="state" name="state" placeholder="e.g. FCT Abuja / Lagos" />
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="submit" id="submitBtn">Submit Bio-Data</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <!-- Submission Preview Card -->
    <div id="previewCard" class="preview-card hidden">
      <h3>Submitted Bio-Data Details</h3>
      <div id="previewContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
